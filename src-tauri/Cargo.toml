[package]
name = "winkit"
version = "0.3.0"
description = "Herramientas para Windows con Claude"
authors = ["Alejandro Font"]
license = "MIT"
edition = "2021"

[lib]
name = "winkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
# Voz local: descomprimir el motor y el modelo descargados (.tar.bz2, en Rust puro).
bzip2 = "0.6.1"
futures-util = "0.3.34"
png = "0.18.1"
raw-window-handle = "0.6.2"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "default-tls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tokio = { version = "1.54.1", features = ["time", "sync"] }
whatlang = "0.18.0"
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Power", "Win32_System_Shutdown", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_UI_Shell_PropertiesSystem", "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Performance", "Win32_Devices_Display", "Win32_Graphics_Direct3D_Fxc", "Media_Core", "Media_SpeechSynthesis", "Storage_Streams", "Win32_System_LibraryLoader"] }
windows-core = "0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
